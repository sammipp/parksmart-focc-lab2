apiVersion: v1
kind: ConfigMap
metadata:
  name: parksmart-config
  namespace: parksmart
data:
  FLASK_ENV: "production"
  REDIS_URL: "redis://parksmart-redis:6379/0"
  CORS_ORIGINS: "*"
  PORT: "5000"
  # For cloud deployment, set DATABASE_URL to your RDS PostgreSQL endpoint:
  # DATABASE_URL: "postgresql://parksmart:PASSWORD@your-rds-endpoint.rds.amazonaws.com:5432/parksmart"
  # For single-instance demo only (not suitable for multi-replica):
  DATABASE_URL: "sqlite:////app/data/parksmart.db"
