# Requires metrics-server to be installed in the cluster:
# kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parksmart-backend-hpa
  namespace: parksmart
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parksmart-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parksmart-frontend-hpa
  namespace: parksmart
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parksmart-frontend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
