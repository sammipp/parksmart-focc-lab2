apiVersion: apps/v1
kind: Deployment
metadata:
  name: parksmart-redis
  namespace: parksmart
  labels:
    app: parksmart-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parksmart-redis
  template:
    metadata:
      labels:
        app: parksmart-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: parksmart-redis
  namespace: parksmart
spec:
  selector:
    app: parksmart-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP  # Internal only — never exposed publicly
