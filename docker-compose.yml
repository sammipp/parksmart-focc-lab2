networks:
  parksmart-net:
    driver: bridge

volumes:
  parksmart-db:
    driver: local
  redis-data:
    driver: local

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parksmart-backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-prod}
      - DATABASE_URL=sqlite:////app/data/parksmart.db
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - PORT=5000
    volumes:
      - parksmart-db:/app/data
    ports:
      - "5000:5000"
    networks:
      - parksmart-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parksmart-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - parksmart-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: parksmart-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - parksmart-net
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
